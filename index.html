nav{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;justify-content:center;padding:7px 6px calc(7px + env(safe-area-inset-bottom));background:#080a0b;border-top:1px solid var(--l);box-shadow:0 -6px 22px #000b}nav button{flex:1;max-width:145px;border:0;background:transparent;color:#888;padding:6px 2px 4px;font-size:10px}nav button.active{color:var(--g2);font-weight:800}.ni{display:block;font-size:19px;line-height:20px}

<script>
const K='almirante_v6';const OLD='almirante_v5';const OLD2='almirante_v4';const seed={birds:[
['Ancião','Macho','2024',0],['Patroa','Fêmea','2025',0],['Soberana','Fêmea','2025',0],['Buglê','Macho','2025',1],['Pinky Mary','Fêmea','2025',0],['Coisado','Macho','2025',0],['Franjinha','Fêmea','2025',1],['Bianchini','Macho','2025',0]].map(x=>({name:x[0],sex:x[1],year:x[2],crest:!!x[3],breed:'Arlequim Português',ring:'',color:'',status:'Reprodutor',notes:'',photo:''})),
pairs:[{name:'Patroa × Ancião',nest:1,eggs:0},{name:'Soberana × Buglê',nest:2,eggs:0},{name:'Pinky Mary × Coisado',nest:3,eggs:0},{name:'Franjinha × Bianchini',nest:4,eggs:0}],chicks:[],events:[]};
const GENETICA_V9={
  'Arlequim Português':['Melânico','Topete','Plumagem lisa','Plumagem variegada','Máscara vermelha','Boa presença de vermelho','Boa pigmentação','Equilíbrio entre branco e vermelho','Vermelho','Amarelo','Urucum','Portador de canela','Meio fator'],
  'Vermelho Mosaico':['Linha macho','Linha fêmea','Boa pigmentação','Equilíbrio entre branco e vermelho','Vermelho','Máscara vermelha','Meio fator','Portador de canela'],
  'Amarelo Mosaico':['Linha macho','Linha fêmea','Boa pigmentação','Equilíbrio entre branco e amarelo','Amarelo','Meio fator'],
  'Canela':['Melânico','Canela','Portador de canela','Plumagem lisa','Plumagem variegada','Vermelho','Amarelo'],
  'Ágata':['Melânico','Ágata','Plumagem lisa','Plumagem variegada','Vermelho','Amarelo'],
  'Isabelino':['Melânico','Isabelino','Plumagem lisa','Plumagem variegada','Vermelho','Amarelo'],
  'Opalino':['Melânico','Opalino','Plumagem lisa','Plumagem variegada','Vermelho','Amarelo']
};
let db=JSON.parse(localStorage.getItem(K)||'null');
if(!db){db=JSON.parse(localStorage.getItem(OLD)||localStorage.getItem(OLD2)||'null')||seed;db.pairs=(db.pairs||[]).map(p=>({...p,ovoscopyDate:p.ovoscopyDate||'',ovoscopyResult:p.ovoscopyResult||'',firstEggDate:p.firstEggDate||''}));localStorage.setItem(K,JSON.stringify(db));}else{db.pairs=(db.pairs||[]).map(p=>({...p,ovoscopyDate:p.ovoscopyDate||'',ovoscopyResult:p.ovoscopyResult||'',firstEggDate:p.firstEggDate||''}));}

function initGeneticaV9(){
  if(!Array.isArray(db.breeds)||!db.breeds.length) db.breeds=Object.keys(GENETICA_V9);
  db.birds=(db.birds||[]).map(b=>({...b,breed:b.breed||'Arlequim Português',traits:Array.isArray(b.traits)?b.traits:[]}));
  if(!Array.isArray(db.pairs))db.pairs=[];
  db.pairs=db.pairs.map((p,i)=>{
    let names=String(p.name||'').split('×').map(x=>x.trim());
    return {...p,femaleId:p.femaleId||findBirdIdByName(names[0]),maleId:p.maleId||findBirdIdByName(names[1]),geneticsNote:p.geneticsNote||''};
  });
  save();
}
function findBirdIdByName(name){if(!name)return '';let b=(db.birds||[]).find(x=>x.name===name);return b?b.name:''}
function breedTraitsV9(breed){return GENETICA_V9[breed]||['Melânico','Lipocrômico','Topete','Plumagem lisa','Plumagem variegada','Vermelho','Amarelo','Urucum','Boa pigmentação','Boa presença de vermelho','Equilíbrio entre branco e vermelho','Portador de canela','Meio fator'];}
function save(){localStorage.setItem(K,JSON.stringify(db))}
function requestNotifications(){if(window.AndroidNotifications&&AndroidNotifications.requestPermission){AndroidNotifications.requestPermission();}else{alert('As notificações ficam disponíveis na versão Android V6.');}}
function show(id){document.querySelectorAll('main>section').forEach(s=>s.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));let n=document.getElementById('n-'+id);if(n)n.classList.add('active');render()}
function ph(b,big=false){return b.photo?`<img class="photo ${big?'big':''}" src="${b.photo}">`:`<div class="photo ${big?'big':''}">🐦</div>`}
function render(){inicio.innerHTML=`<div class="card" style="text-align:center"><div class="cross">✠</div><h2>CANARIL ALMIRANTE</h2><div class="muted">Gestão do plantel, reprodução, genética e lembretes</div><div class="actions" style="justify-content:center"><button class="btn primary" onclick="requestNotifications()">🔔 Ativar notificações</button></div></div><div class="grid"><button class="tile" onclick="show('plantel')"><span>🐦</span><b>PLANTEL</b>Fichas e fotos</button><button class="tile" onclick="show('casais')"><span>♧</span><b>CASAIS</b>Reprodução</button><button class="tile" onclick="show('filhotes')"><span>🐣</span><b>FILHOTES</b>Nascimentos</button><button class="tile" onclick="show('agenda')"><span>▦</span><b>AGENDA</b>Manejo</button></div>`;plantel.innerHTML=`<div class="card"><div class="row"><h2>PLANTEL</h2><button class="btn primary" onclick="edit(-1)">+ Canário</button></div>${db.birds.map((b,i)=>`<div class="item"><div class="bird">${ph(b)}<div style="flex:1"><div class="name">${b.name} ${b.sex==='Macho'?'♂':'♀'}</div><div class="muted">${b.breed} · ${b.year}${b.backgroundColor?' · Fundo '+b.backgroundColor:''}</div><span class="tag">${b.crest?'Topete':'Sem topete'}</span></div><button class="btn" onclick="edit(${i})">Abrir</button></div></div>`).join('')}</div>`;
casais.innerHTML=`<div class="card"><h2>CASAIS E REPRODUÇÃO</h2><div class="notice">A partir do primeiro ovo, o aplicativo calcula automaticamente as janelas de nascimento, anilhamento e desmame e cria os lembretes. Você pode ajustar a ovoscopia.</div>${db.pairs.map((p,i)=>`<div class="item"><b>${p.name}</b>
<div class="muted">Ninho ${p.nest} · ${p.eggs} ovos</div>
<div class="grid">
<div><label>Primeiro ovo</label><input type="date" id="fe-${i}" value="${p.firstEggDate||''}" onchange="calcularRepro(${i})"></div>
<div><label>Ovoscopia</label><input type="date" id="ov-${i}" value="${p.ovoscopyDate||''}" onchange="salvarOvoscopia(${i})"></div>
<div><label>Nascimento previsto (13–15 dias)</label><input type="text" id="bn-${i}" value="${p.birthRange||''}" readonly></div>
<div><label>Anilhamento previsto</label><input type="text" id="rg-${i}" value="${p.ringRange||''}" readonly></div>
<div><label>Desmame previsto</label><input type="text" id="wn-${i}" value="${p.weanRange||''}" readonly></div>
<div><label>Resultado da ovoscopia</label><select id="or-${i}" onchange="salvarResultado(${i})"><option ${!p.ovoscopyResult||p.ovoscopyResult==='Não realizada'?'selected':''}>Não realizada</option><option ${p.ovoscopyResult==='Férteis'?'selected':''}>Férteis</option><option ${p.ovoscopyResult==='Claros'?'selected':''}>Claros</option><option ${p.ovoscopyResult==='Parcial'?'selected':''}>Parcial</option></select></div>
</div>
<div class="muted">🏷️ Anilhamento previsto: ${p.ringRange||'—'} · 🐥 Desmame previsto: ${p.weanRange||'—'}</div>
<div class="actions"><button class="btn primary" onclick="saveRepro(${i})">Salvar reprodução</button><button class="btn" onclick="egg(${i})">+ Ovo</button><button class="btn" onclick="obs(${i})">+ Observação</button></div>
<div class="card" style="margin-top:12px">
<h3>🪺 Atualização do ninho</h3>
<div class="muted">Registre cada ovo desta postura e marque o resultado. O histórico fica salvo no casal.</div>
<div id="ninho-${i}" style="margin-top:10px"></div>
<div class="actions"><button class="btn" onclick="novaPosturaV8(${i})">+ Nova postura</button></div>
<div id="desempenho-${i}" style="margin-top:10px"></div>
</div>
</div>`).join('')}</div>`;
filhotes.innerHTML=`<div class="card"><div class="row"><h2>FILHOTES</h2><button class="btn primary" onclick="chick()">+ Filhote</button></div>${db.chicks.length?db.chicks.map(c=>`<div class="item"><b>${c.code}</b><div class="muted">${c.date} · ${c.sex||'Sexo não definido'} · ${c.pair}</div></div>`).join(''):'<div class="muted">Nenhum filhote registrado.</div>'}</div>`;
agenda.innerHTML=`<div class="card"><div class="row"><h2>AGENDA</h2><button class="btn primary" onclick="eventAdd()">+ Lembrete</button></div>
<div class="notice">As notificações programadas são do Android e podem aparecer com o aplicativo fechado. Na primeira vez, permita as notificações quando o Android solicitar.</div>
${db.events.slice().reverse().map(e=>`<div class="item"><b>${e.date}</b><div>${e.text}</div><div class="muted">${e.pair||''}</div></div>`).join('')}</div>`}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function edit(i){
  let b=i<0?{name:'',sex:'Macho',year:'2026',breed:'Arlequim Português',crest:false,ring:'',color:'',status:'Ativo',notes:'',photo:'',traits:[],backgroundColor:''}:db.birds[i];
  if(!Array.isArray(b.traits))b.traits=[];
  show('ficha');
  let breeds=(db.breeds||Object.keys(GENETICA_V9));
  ficha.innerHTML=`<div class="card"><div class="row"><h2>${i<0?'NOVO CANÁRIO':'FICHA DO CANÁRIO'}</h2><button class="btn" onclick="show('plantel')">Voltar</button></div><div style="text-align:center">${ph(b,true)}</div><label>Foto da galeria</label>
<input id="foto" type="file" accept="image/*">
<div id="analiseFotoV92" class="notice" style="margin-top:10px">
  📷 <b>Análise visual da foto</b>
  <div class="muted" style="margin-top:5px">A análise sugere características visíveis. Ela não determina genótipos nem características de portador.</div>
  <div class="actions"><button class="btn" type="button" onclick="analisarFotoV92()">🔎 Analisar foto</button></div>
</div>
<div id="identificacaoV10" class="notice" style="margin-top:10px">
  <div style="font-size:18px"><b>🐦 Identificação visual por foto — V10</b></div>
  <div class="muted" style="margin-top:5px">
    Sugere a variedade/raça visual com base em cor, padrão e distribuição observados na foto.
    A identificação é assistida e deve ser confirmada por você.
  </div>
  <div id="resultadoIdentificacaoV10" style="margin-top:9px">
    Escolha uma foto e toque em <b>Identificar ave</b>.
  </div>
  <div class="actions">
    <button class="btn primary" type="button" onclick="identificarAveV10()">🔎 Identificar ave</button>
  </div>
</div>
<label>Nome</label><input id="nm" value="${esc(b.name)}"><label>Sexo</label><select id="sx"><option ${b.sex==='Macho'?'selected':''}>Macho</option><option ${b.sex==='Fêmea'?'selected':''}>Fêmea</option></select><label>Ano</label><input id="yr" value="${esc(b.year)}"><label>Raça</label><select id="br">${breeds.map(r=>`<option ${b.breed===r?'selected':''}>${esc(r)}</option>`).join('')}</select><div class="actions"><button class="btn" type="button" onclick="adicionarRacaV9()">+ Adicionar raça</button></div><div id="fundoV9"></div><label><input id="tp" type="checkbox" ${b.crest?'checked':''}> Topete</label><label>Anilha</label><input id="an" value="${esc(b.ring)}"><label>Cor / padrão livre</label><input id="co" value="${esc(b.color)}"><label>Status</label><input id="st" value="${esc(b.status)}"><label>Características selecionadas</label><div id="traitsV9" class="item" style="display:block"></div><label>Observações</label><textarea id="no">${esc(b.notes)}</textarea><div class="actions"><button class="btn primary" onclick="saveBird(${i})">Salvar ficha</button>${i>=0?`<button class="btn danger" onclick="delBird(${i})">Excluir</button>`:''}</div></div>`;
  function atualiza(){let opts=breedTraitsV9(br.value);let mostraFundo=['Ágata','Isabelino','Opalino'].includes(br.value);fundoV9.innerHTML=mostraFundo?`<label>Cor de fundo</label><select id="fc"><option value="">Não informado</option><option value="Amarelo" ${b.backgroundColor==='Amarelo'?'selected':''}>Amarelo</option><option value="Vermelho" ${b.backgroundColor==='Vermelho'?'selected':''}>Vermelho</option></select>`:'';traitsV9.innerHTML=opts.map((x,j)=>`<label style="display:block;margin:7px 0"><input type="checkbox" class="trV9" value="${esc(x)}" ${(b.traits||[]).includes(x)?'checked':''}> ${esc(x)}</label>`).join('')}
  br.onchange=atualiza; atualiza();
  foto.onchange=()=>{let f=foto.files[0];if(!f)return;let r=new FileReader();r.onload=()=>foto.dataset.data=r.result;r.readAsDataURL(f)}
}
function adicionarRacaV9(){let r=prompt('Nome da nova raça:');if(!r)return;r=r.trim();if(!r)return;if(!db.breeds.includes(r)){db.breeds.push(r);save();}br.innerHTML=db.breeds.map(x=>`<option ${x===r?'selected':''}>${esc(x)}</option>`).join('');br.value=r;br.dispatchEvent(new Event('change'));}

async function analisarFotoV92(){
  const file = foto.files && foto.files[0];
  const box = document.getElementById('analiseFotoV92');
  if(!file){
    box.innerHTML = '📷 <b>Análise visual da foto</b><div class="muted">Escolha uma foto primeiro.</div>';
    return;
  }
  box.innerHTML = '📷 <b>Análise visual</b><div class="muted">Analisando a distribuição de cores da imagem…</div>';
  const img = new Image();
  const url = URL.createObjectURL(file);
  img.onload = ()=>{
    try{
      const c=document.createElement('canvas'), ctx=c.getContext('2d',{willReadFrequently:true});
      const max=420, scale=Math.min(1,max/Math.max(img.width,img.height));
      c.width=Math.max(1,Math.round(img.width*scale)); c.height=Math.max(1,Math.round(img.height*scale));
      ctx.drawImage(img,0,0,c.width,c.height);
      const d=ctx.getImageData(0,0,c.width,c.height).data;
      let red=0,yellow=0,dark=0,light=0,valid=0;
      for(let p=0;p<d.length;p+=4){
        const r=d[p],g=d[p+1],b=d[p+2],a=d[p+3];
        if(a<30) continue;
        const mx=Math.max(r,g,b), mn=Math.min(r,g,b), lum=(r+g+b)/3;
        valid++;
        if(lum<70) dark++;
        if(lum>205 && mx-mn<45) light++;
        if(r>125 && r>g*1.28 && r>b*1.28) red++;
        if(r>125 && g>105 && b<120 && r>b*1.15 && g>b*1.08) yellow++;
      }
      const pct=x=>valid?Math.round(x/valid*100):0;
      const pr=pct(red), py=pct(yellow), pd=pct(dark), pl=pct(light);
      const sug=[];
      if(pr>=8) sug.push('Vermelho');
      if(py>=8 && pr<18) sug.push('Amarelo');
      if(pd>=18) sug.push('Melânico');
      if(pl>=18 && pd>=10) sug.push('Plumagem variegada');
      if(!sug.length) sug.push('Nenhuma característica visual foi detectada com confiança suficiente');
      const opts=[...document.querySelectorAll('.trV9')];
      const selectable=sug.filter(x=>opts.some(o=>o.value===x));
      box.innerHTML=`📷 <b>Análise visual da foto</b>
        <div style="margin-top:7px">${sug.map(x=>`<div>• ${esc(x)}</div>`).join('')}</div>
        <div class="muted" style="margin-top:7px">Indicadores visuais: vermelho ${pr}% · amarelo ${py}% · áreas escuras ${pd}% · áreas claras ${pl}%.</div>
        <div class="muted" style="margin-top:7px">⚠️ Pré-análise local: iluminação, fundo e enquadramento podem alterar o resultado. Não é uma confirmação genética.</div>
        ${selectable.length?`<div class="actions"><button class="btn primary" type="button" onclick="aplicarSugestoesV92(${JSON.stringify(selectable).replace(/"/g,'&quot;')})">✓ Marcar sugestões</button></div>`:''}`;
    }catch(e){
      box.innerHTML='📷 <b>Análise visual</b><div class="muted">Não foi possível analisar esta foto.</div>';
    }finally{ URL.revokeObjectURL(url); }
  };
  img.onerror=()=>{box.innerHTML='📷 <b>Análise visual</b><div class="muted">Não foi possível abrir a foto.</div>';URL.revokeObjectURL(url)};
  img.src=url;
}
function aplicarSugestoesV92(lista){
  (lista||[]).forEach(v=>{
    const el=[...document.querySelectorAll('.trV9')].find(x=>x.value===v);
    if(el) el.checked=true;
  });
  const box=document.getElementById('analiseFotoV92');
  if(box) box.innerHTML += '<div style="margin-top:7px"><b>✓ Sugestões marcadas na ficha.</b> Revise antes de salvar.</div>';
}


function identificarAveV10(){
  const file = foto.files && foto.files[0];
  const box = document.getElementById('resultadoIdentificacaoV10');
  if(!file){
    box.innerHTML = '⚠️ Escolha uma foto primeiro.';
    return;
  }
  box.innerHTML = '⏳ Analisando cores e distribuição visual…';
  const img = new Image();
  const url = URL.createObjectURL(file);
  img.onload = ()=>{
    try{
      const c=document.createElement('canvas'), ctx=c.getContext('2d',{willReadFrequently:true});
      const max=520, scale=Math.min(1,max/Math.max(img.width,img.height));
      c.width=Math.max(1,Math.round(img.width*scale)); c.height=Math.max(1,Math.round(img.height*scale));
      ctx.drawImage(img,0,0,c.width,c.height);
      const d=ctx.getImageData(0,0,c.width,c.height).data;
      let red=0,yellow=0,dark=0,white=0,gray=0,valid=0;
      for(let p=0;p<d.length;p+=4){
        const r=d[p],g=d[p+1],b=d[p+2],a=d[p+3];
        if(a<30) continue;
        const mx=Math.max(r,g,b), mn=Math.min(r,g,b), lum=(r+g+b)/3;
        valid++;
        if(lum<72) dark++;
        if(lum>205 && mx-mn<48) white++;
        if(mx-mn<28 && lum>=72 && lum<=205) gray++;
        if(r>125 && r>g*1.28 && r>b*1.28) red++;
        if(r>125 && g>105 && b<120 && r>b*1.15 && g>b*1.08) yellow++;
      }
      const pct=x=>valid?x/valid*100:0;
      const pr=pct(red), py=pct(yellow), pd=pct(dark), pw=pct(white), pg=pct(gray);

      // Heuristic candidates. These are visual suggestions, not genetic conclusions.
      let candidates=[];
      if(pr>=10 && pw>=18 && pd<12) candidates.push(['Vermelho Mosaico', Math.min(92,62+pr*.8+pw*.12)]);
      if(py>=10 && pw>=18 && pd<12) candidates.push(['Amarelo Mosaico', Math.min(90,60+py*.8+pw*.12)]);
      if(pr>=8 && pd>=10 && pw>=10) candidates.push(['Arlequim Português', Math.min(88,56+pr*.45+pd*.65+pw*.08)]);
      if(pd>=18 && py<10 && pr<10) candidates.push(['Variedade melânica', Math.min(78,55+pd*.35)]);
      if(!candidates.length){
        candidates=[['Não conclusivo pela foto',50]];
      }
      candidates.sort((a,b)=>b[1]-a[1]);
      const best=candidates[0];

      let details=[];
      if(pr>=8) details.push('🔴 presença visual de vermelho');
      if(py>=8) details.push('🟡 presença visual de amarelo');
      if(pd>=10) details.push('⚫ áreas escuras/melânicas');
      if(pw>=15) details.push('⚪ áreas claras/brancas');
      if(!details.length) details.push('Poucos sinais cromáticos suficientes para uma classificação confiável');

      box.innerHTML = `
        <div><b>Resultado visual sugerido</b></div>
        <div style="font-size:20px;margin-top:6px">🐦 ${esc(best[0])}</div>
        <div style="margin-top:4px">Confiança visual estimada: <b>${Math.round(best[1])}%</b></div>
        <div style="margin-top:8px">${details.map(x=>'<div>• '+esc(x)+'</div>').join('')}</div>
        <div class="muted" style="margin-top:8px">
          ⚠️ Esta versão não confirma raça por genética, pedigree ou padrão oficial. Fundo, luz, pose e qualidade da foto podem mudar o resultado.
          Características como “portador de canela” não podem ser determinadas pela foto.
        </div>
        <div class="actions" style="margin-top:8px">
          <button class="btn" type="button" onclick="usarIdentificacaoV10('${esc(best[0])}')">✓ Usar como sugestão na ficha</button>
        </div>
      `;
    }catch(e){
      box.innerHTML='⚠️ Não foi possível analisar a foto.';
    }finally{ URL.revokeObjectURL(url); }
  };
  img.onerror=()=>{box.innerHTML='⚠️ Não foi possível abrir a foto.';URL.revokeObjectURL(url)};
  img.src=url;
}

function usarIdentificacaoV10(raca){
  const sel=[...document.querySelectorAll('select')].find(s=>[...s.options].some(o=>o.value===raca));
  if(sel){ sel.value=raca; sel.dispatchEvent(new Event('change')); }
  const box=document.getElementById('resultadoIdentificacaoV10');
  if(box) box.innerHTML += '<div style="margin-top:8px"><b>✓ Sugestão aplicada.</b> Revise a raça e salve somente se estiver de acordo.</div>';
}

function saveBird(i){let old=i>=0?db.birds[i]:{};let traits=[...document.querySelectorAll('.trV9:checked')].map(x=>x.value);let b={name:nm.value.trim()||'Sem nome',sex:sx.value,year:yr.value,breed:br.value||'Arlequim Português',backgroundColor:(document.getElementById('fc')||{}).value||'',crest:tp.checked,ring:an.value,color:co.value,status:st.value,notes:no.value,photo:foto.dataset.data||old.photo||'',traits};i<0?db.birds.push(b):db.birds[i]=b;save();show('plantel')}
function delBird(i){if(confirm('Excluir este canário?')){db.birds.splice(i,1);save();show('plantel')}}

function fmt(d){return d?d.toLocaleDateString('pt-BR'):''}

function isoAdd(iso,days){
  if(!iso)return '';
  let d=new Date(iso+'T12:00:00');
  d.setDate(d.getDate()+days);
  return d.toISOString().slice(0,10);
}

function dateRange(start,end){
  if(!start || !end)return '—';
  return fmt(new Date(start+'T12:00:00'))+' a '+fmt(new Date(end+'T12:00:00'));
}

function schedule(title,date,pair){
  if(!date)return;
  if(window.AndroidNotifications && AndroidNotifications.schedule){
    AndroidNotifications.schedule(title, date+'T08:00:00', pair||'');
  }
}

function calcularDados(p){
  if(!p.firstEggDate)return;

  let first=p.firstEggDate;

  p.birthStart=isoAdd(first,13);
  p.birthEnd=isoAdd(first,15);
  p.birthRange=dateRange(p.birthStart,p.birthEnd);

  p.ringStart=isoAdd(p.birthStart,6);
  p.ringEnd=isoAdd(p.birthEnd,6);
  p.ringRange=dateRange(p.ringStart,p.ringEnd);

  p.weanStart=isoAdd(p.birthStart,30);
  p.weanEnd=isoAdd(p.birthEnd,35);
  p.weanRange=dateRange(p.weanStart,p.weanEnd);

  if(!p.ovoscopyDate)p.ovoscopyDate=isoAdd(first,6);
}

function atualizarTelaRepro(i){
  let p=db.pairs[i];
  calcularDados(p);

  let ov=document.getElementById('ov-'+i);
  let bn=document.getElementById('bn-'+i);
  let rg=document.getElementById('rg-'+i);
  let wn=document.getElementById('wn-'+i);

  if(ov)ov.value=p.ovoscopyDate||'';
  if(bn)bn.value=p.birthRange||'';
  if(rg)rg.textContent=p.ringRange||'—';
  if(wn)wn.textContent=p.weanRange||'—';
}

function calcularRepro(i){
  let p=db.pairs[i];
  let first=document.getElementById('fe-'+i).value;

  if(!first){
    p.firstEggDate='';
    p.birthStart='';p.birthEnd='';p.birthRange='';
    p.ringStart='';p.ringEnd='';p.ringRange='';
    p.weanStart='';p.weanEnd='';p.weanRange='';
    p.ovoscopyDate='';
    save();
    document.getElementById('ov-'+i).value='';
    document.getElementById('bn-'+i).value='';
    let item=document.getElementById('bn-'+i).closest('.item');
    let muted=item ? item.querySelector('.muted:last-of-type') : null;
    if(muted)muted.innerHTML='🏷️ Anilhamento previsto: — · 🐥 Desmame previsto: —';
    return;
  }

  p.firstEggDate=first;
  calcularDados(p);
  save();
  atualizarTelaRepro(i);
}

function scheduleRepro(p){
  if(!p.firstEggDate)return;

  calcularDados(p);

  schedule('Ovoscopia — '+p.name,p.ovoscopyDate,p.name);

  schedule('Nascimento previsto — início — '+p.name,p.birthStart,p.name);
  schedule('Nascimento previsto — final — '+p.name,p.birthEnd,p.name);

  schedule('Anilhamento previsto — início — '+p.name,p.ringStart,p.name);
  schedule('Anilhamento previsto — final — '+p.name,p.ringEnd,p.name);

  schedule('Desmame previsto — início — '+p.name,p.weanStart,p.name);
  schedule('Desmame previsto — final — '+p.name,p.weanEnd,p.name);
}

function salvarOvoscopia(i){
  let p=db.pairs[i];
  p.ovoscopyDate=document.getElementById('ov-'+i).value;
  save();
}

function salvarResultado(i){
  let p=db.pairs[i];
  p.ovoscopyResult=document.getElementById('or-'+i).value;
  save();
}

function egg(i){
  let p=db.pairs[i];
  p.eggs++;
  if(!p.firstEggDate)p.firstEggDate=new Date().toISOString().slice(0,10);

  calcularDados(p);
  scheduleRepro(p);

  db.events.push({date:fmt(new Date()),text:'Ovo registrado. Nascimento previsto: '+p.birthRange,pair:p.name});
  save();
  render();
}

function saveRepro(i){
  let p=db.pairs[i];

  p.firstEggDate=document.getElementById('fe-'+i).value;
  p.ovoscopyDate=document.getElementById('ov-'+i).value;
  p.ovoscopyResult=document.getElementById('or-'+i).value;

  if(p.firstEggDate){
    calcularDados(p);
    scheduleRepro(p);
  }

  db.events.push({
    date:fmt(new Date()),
    text:'Reprodução atualizada. Ovoscopia: '+
      (p.ovoscopyDate?fmt(new Date(p.ovoscopyDate+'T12:00:00')):'não definida')+
      ' · Nascimento previsto: '+
      (p.birthRange||'não definido'),
    pair:p.name
  });

  save();
  render();
}

function saveOvo(i){saveRepro(i)}

function obs(i){
  let p=db.pairs[i];
  let t=prompt('Observação para '+p.name+':');
  if(t){
    db.events.push({date:fmt(new Date()),text:t,pair:p.name});
    save();
    render();
  }
}

function chick(){
  let p=prompt('Casal:',db.pairs[0].name);
  if(!p)return;
  let c='ALM-'+new Date().getFullYear()+'-'+String(db.chicks.length+1).padStart(3,'0');
  db.chicks.push({code:c,date:new Date().toLocaleDateString('pt-BR'),sex:'',pair:p});
  save();
  render();
}

function eventAdd(){
  let t=prompt('Descrição do lembrete:');
  if(!t)return;
  let d=prompt('Data (AAAA-MM-DD):',new Date().toISOString().slice(0,10));
  if(!d)return;
  let h=prompt('Horário (HH:MM):','08:00')||'08:00';

  db.events.push({date:fmt(new Date(d+'T12:00:00')),text:t,pair:'',iso:d+'T'+h+':00'});

  if(window.AndroidNotifications&&AndroidNotifications.schedule)
    AndroidNotifications.schedule(t,d+'T'+h+':00','Canaril Almirante');

  save();
  render();
}

function birdByNameV9(name){return (db.birds||[]).find(b=>b.name===name)}
function namesPairV9(p){let f=p.femaleId?birdByNameV9(p.femaleId):null,m=p.maleId?birdByNameV9(p.maleId):null;if(!f||!m){let n=String(p.name||'').split('×').map(x=>x.trim());f=f||birdByNameV9(n[0]);m=m||birdByNameV9(n[1]);}return {f,m}}
function possiveisGeneticaV9(f,m){let ft=new Set(f?.traits||[]),mt=new Set(m?.traits||[]);let all=[...new Set([...(f?.traits||[]),...(m?.traits||[])])];let shared=all.filter(x=>ft.has(x)&&mt.has(x));let only=all.filter(x=>!shared.includes(x));let linhas=[];if(shared.length)linhas.push('<b>🟢 Características presentes nos dois pais</b><div class="muted">'+shared.map(esc).join(' · ')+'</div>');if(only.length)linhas.push('<b>🟡 Características presentes em pelo menos um dos pais</b><div class="muted">'+only.map(esc).join(' · ')+'</div>');linhas.push('<div class="notice">⚠️ A lista indica características observadas/cadastradas nos pais. Ela não transforma automaticamente aparência em genótipo nem inventa percentuais. Quando o genótipo não for conhecido, a previsão fica indeterminada.</div>');return linhas.join('<div style="margin-top:8px">')+'</div>'}
function renderGeneticaV9(){
  genetica.innerHTML=`<div class="card"><div class="row"><h2>🧬 GENÉTICA</h2><button class="btn primary" onclick="novoCasalV9()">+ Cruzamento</button></div><div class="notice">Escolha qualquer ave do plantel como pai ou mãe. As características são selecionadas individualmente na ficha de cada ave.</div>${(db.pairs||[]).map((p,i)=>{let n=namesPairV9(p);return `<div class="item"><b>${esc(p.name||'Cruzamento')}</b><div class="grid"><div><label>Fêmea</label><select onchange="mudarPaiV9(${i},'f',this.value)"><option value="">Selecionar</option>${db.birds.filter(b=>b.sex==='Fêmea').map(b=>`<option value="${esc(b.name)}" ${n.f?.name===b.name?'selected':''}>${esc(b.name)}</option>`).join('')}</select></div><div><label>Macho</label><select onchange="mudarPaiV9(${i},'m',this.value)"><option value="">Selecionar</option>${db.birds.filter(b=>b.sex==='Macho').map(b=>`<option value="${esc(b.name)}" ${n.m?.name===b.name?'selected':''}>${esc(b.name)}</option>`).join('')}</select></div></div>${n.f&&n.m?`<div style="margin-top:8px"><b>Fêmea:</b> ${esc(n.f.breed)} · ${(n.f.traits||[]).length} características<br><b>Macho:</b> ${esc(n.m.breed)} · ${(n.m.traits||[]).length} características</div><div style="margin-top:10px">${possiveisGeneticaV9(n.f,n.m)}</div>`:'<div class="muted">Selecione os dois pais para analisar o cruzamento.</div>'}</div>`}).join('')}</div><div class="card"><h3>📚 Raças cadastradas</h3><div class="muted">${(db.breeds||[]).map(esc).join(' · ')}</div><div class="actions"><button class="btn" onclick="adicionarRacaV9();renderGeneticaV9()">+ Adicionar raça</button></div></div>`;
}
function mudarPaiV9(i,tipo,nome){let p=db.pairs[i],b=birdByNameV9(nome);if(!p||!b)return;if(tipo==='f')p.femaleId=b.name;else p.maleId=b.name;let f=birdByNameV9(p.femaleId),m=birdByNameV9(p.maleId);if(f&&m)p.name=f.name+' × '+m.name;save();renderGeneticaV9()}
function novoCasalV9(){let f=(db.birds||[]).find(b=>b.sex==='Fêmea'),m=(db.birds||[]).find(b=>b.sex==='Macho');db.pairs.push({name:(f&&m)?f.name+' × '+m.name:'Novo cruzamento',nest:(db.pairs.length+1),eggs:0,posturas:[],femaleId:f?.name||'',maleId:m?.name||'',firstEggDate:'',ovoscopyDate:'',ovoscopyResult:''});save();show('genetica')}
db.pairs.forEach(p=>{
  if(p.firstEggDate){
    calcularDados(p);
    scheduleRepro(p);
  }
});

save();
show('inicio');

/* V8.2 — controle seguro do ninho, usando o mesmo banco db da V6.2 */
function initNinhoV8(){
  (db.pairs||[]).forEach(p=>{
    if(!Array.isArray(p.posturas)) p.posturas=[];
  });
  save();
}
function novaPosturaV8(i){
  const p=db.pairs[i]; if(!p) return;
  if(!Array.isArray(p.posturas)) p.posturas=[];
  p.posturas.push({data:p.firstEggDate||'', ovos:[{resultado:''}]});
  p.eggs=(p.eggs||0)+1;
  save(); render(); setTimeout(()=>renderNinhoV8(i),50);
}
function addOvoV8(i,pi){
  const p=db.pairs[i], post=p?.posturas?.[pi]; if(!post)return;
  post.ovos.push({resultado:''});
  p.eggs=(p.eggs||0)+1;
  save(); render(); setTimeout(()=>renderNinhoV8(i),50);
}
function delOvoV8(i,pi,oi){
  const p=db.pairs[i], post=p?.posturas?.[pi]; if(!post)return;
  if(post.ovos.length<=1){alert('A postura precisa ter pelo menos 1 ovo. Para removê-la inteira, use Apagar postura.');return;}
  post.ovos.splice(oi,1);
  p.eggs=Math.max(0,(p.eggs||0)-1);
  save(); render(); setTimeout(()=>renderNinhoV8(i),50);
}
function resultadoOvoV8(i,pi,oi,v){
  const p=db.pairs[i], o=p?.posturas?.[pi]?.ovos?.[oi]; if(!o)return;
  o.resultado=v; save(); renderNinhoV8(i);
}
function apagarPosturaV8(i,pi){
  const p=db.pairs[i]; if(!p?.posturas?.[pi])return;
  if(!confirm('Apagar esta postura e todos os ovos registrados nela?'))return;
  const qtd=p.posturas[pi].ovos?.length||0;
  p.posturas.splice(pi,1);
  p.eggs=Math.max(0,(p.eggs||0)-qtd);
  save(); render(); setTimeout(()=>renderNinhoV8(i),50);
}
function refazerPosturaV8(i,pi){
  const p=db.pairs[i]; if(!p?.posturas?.[pi])return;
  if(!confirm('Refazer esta postura? Os resultados dos ovos serão zerados.'))return;
  p.posturas[pi].ovos=[{resultado:''}];
  save(); render(); setTimeout(()=>renderNinhoV8(i),50);
}
function renderNinhoV8(i){
  const p=db.pairs[i], box=document.getElementById('ninho-'+i), resumo=document.getElementById('desempenho-'+i);
  if(!p||!box)return;
  if(!Array.isArray(p.posturas))p.posturas=[];
  let out='';
  p.posturas.forEach((post,pi)=>{
    const ovos=post.ovos||[];
    const fert=ovos.filter(o=>o.resultado==='fertil').length;
    const inf=ovos.filter(o=>o.resultado==='infertil').length;
    out+=`<div class="item" style="margin-bottom:10px">
      <div><b>${pi+1}ª postura</b>
      <button class="btn" type="button" onclick="refazerPosturaV8(${i},${pi})">↻ Refazer</button>
      <button class="btn" type="button" onclick="apagarPosturaV8(${i},${pi})">🗑 Apagar</button></div>
      ${ovos.map((o,oi)=>`<div style="margin-top:7px;display:flex;gap:6px;align-items:center;flex-wrap:wrap">
        <span>🥚 Ovo ${oi+1}</span>
        <select onchange="resultadoOvoV8(${i},${pi},${oi},this.value)">
          <option value="" ${!o.resultado?'selected':''}>Resultado</option>
          <option value="fertil" ${o.resultado==='fertil'?'selected':''}>Fértil</option>
          <option value="infertil" ${o.resultado==='infertil'?'selected':''}>Não fértil</option>
        </select>
        <button class="btn" type="button" onclick="delOvoV8(${i},${pi},${oi})">×</button>
      </div>`).join('')}
      <div class="actions"><button class="btn" type="button" onclick="addOvoV8(${i},${pi})">+ Ovo</button></div>
      <div class="muted">Total no ninho: ${ovos.length} ovos · Férteis: ${fert} · Não férteis: ${inf}</div>
    </div>`;
  });
  box.innerHTML=out||'<div class="muted">Nenhuma postura registrada ainda.</div>';
  if(resumo){
    let total=0,fert=0,inf=0;
    p.posturas.forEach(post=>(post.ovos||[]).forEach(o=>{
      total++; if(o.resultado==='fertil')fert++; if(o.resultado==='infertil')inf++;
    }));
    const taxa=total?((fert/total)*100).toFixed(1).replace('.',','):'0';
    resumo.innerHTML=`<b>📊 Desempenho do casal</b><div class="muted">Posturas: ${p.posturas.length} · Total de ovos: ${total} · Férteis: ${fert} · Não férteis: ${inf} · Fertilidade: ${taxa}%</div>`;
  }
}
function getPairBirdNamesV83(pair){
  const parts=String(pair?.name||'').split('×').map(x=>x.trim());
  return {female:parts[0]||'Fêmea não identificada', male:parts[1]||'Macho não identificado'};
}
function statsPosturasV83(posturas){
  let posturasCount=(posturas||[]).length,total=0,fert=0,inf=0;
  (posturas||[]).forEach(post=>(post.ovos||[]).forEach(o=>{
    total++;
    if(o.resultado==='fertil')fert++;
    if(o.resultado==='infertil')inf++;
  }));
  return {posturas:posturasCount,total,fert,inf,taxa:total?((fert/total)*100).toFixed(1).replace('.',','):'0'};
}
function historicoIndividualV83(nome){
  let registros=[];
  (db.pairs||[]).forEach((p,pi)=>{
    const names=getPairBirdNamesV83(p);
    if(names.female===nome || names.male===nome){
      const st=statsPosturasV83(p.posturas||[]);
      if(st.total || st.posturas) registros.push({pair:p.name,st});
    }
  });
  let total={posturas:0,total:0,fert:0,inf:0};
  registros.forEach(r=>{total.posturas+=r.st.posturas;total.total+=r.st.total;total.fert+=r.st.fert;total.inf+=r.st.inf;});
  total.taxa=total.total?((total.fert/total.total)*100).toFixed(1).replace('.',','):'0';
  return {registros,total};
}
function renderHistoricoV83(i){
  const p=db.pairs[i], box=document.getElementById('desempenho-'+i);
  if(!p||!box)return;
  const names=getPairBirdNamesV83(p);
  const st=statsPosturasV83(p.posturas||[]);
  const hf=historicoIndividualV83(names.female), hm=historicoIndividualV83(names.male);
  const bloco=(nome,tipo,hist)=>`<div class="item" style="padding:9px 0"><b>${tipo}: ${esc(nome)}</b><div class="muted">Neste casal: ${st.posturas} ${tipo==='Fêmea'?'postura(s)':'cruzamento(s)'} · ${st.total} ovos · ${st.fert} férteis · ${st.inf} não férteis · ${st.taxa}%</div><div class="muted">Histórico total: ${hist.total.posturas} evento(s) · ${hist.total.total} ovos · ${hist.total.fert} férteis · ${hist.total.inf} não férteis · ${hist.total.taxa}%</div></div>`;
  box.innerHTML=`<b>📊 Desempenho do casal</b><div class="muted">Posturas: ${st.posturas} · Total de ovos: ${st.total} · Férteis: ${st.fert} · Não férteis: ${st.inf} · Fertilidade: ${st.taxa}%</div><div style="margin-top:8px"><b>📚 Histórico individual</b>${bloco(names.female,'Fêmea',hf)}${bloco(names.male,'Macho',hm)}</div>`;
}
function renderTodosNinhosV8(){
  (db.pairs||[]).forEach((p,i)=>{renderNinhoV8(i);renderHistoricoV83(i);});
}
initNinhoV8();
initGeneticaV9();
const renderOriginalV8=render;
render=function(){renderOriginalV8();setTimeout(()=>{renderTodosNinhosV8();renderGeneticaV9();},30);}
</script></body></html>
