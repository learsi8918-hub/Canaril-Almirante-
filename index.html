<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050607">
<title>Almirante Canaril</title>
<style>
:root{--bg:#050607;--panel:#0d1012;--panel2:#111518;--gold:#d7a936;--gold2:#f0c85b;--red:#b51618;--text:#f5f3ed;--muted:#aaa89f;--line:#4b3b16;--ok:#74b85c}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom));}
button,input,select,textarea{font:inherit}
.app{max-width:720px;margin:auto;min-height:100vh}
header{padding:18px 18px 14px;text-align:center;border-bottom:1px solid var(--line);background:linear-gradient(#0a0c0d,#050607);position:sticky;top:0;z-index:10}
.logo-cross{font-size:38px;color:#d21b1e;line-height:1;text-shadow:0 0 10px #6d0909}
.brand{font-family:Georgia,serif;font-size:30px;letter-spacing:2px;color:var(--gold2);font-weight:800}
.sub{font-size:11px;letter-spacing:2px;color:#e6e0d2;margin-top:2px}
main{padding:16px}
.hero{background:radial-gradient(circle at 50% 0,#211b0c,#0a0c0d 55%);border:1px solid var(--line);border-radius:22px;padding:22px 16px;text-align:center;box-shadow:0 8px 30px #0008}
.hero h2{font-family:Georgia,serif;color:var(--gold2);margin:0 0 5px;font-size:28px}
.hero p{margin:0;color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.tile{border:1px solid var(--line);border-radius:18px;background:linear-gradient(145deg,#14181a,#090b0c);padding:20px 10px;text-align:center;color:var(--text);min-height:118px}
.tile .ico{font-size:32px;color:var(--gold2);margin-bottom:6px}.tile b{display:block;color:var(--gold2);letter-spacing:1px}.tile small{color:var(--muted)}
.card{background:var(--panel);border:1px solid #252a2c;border-radius:17px;padding:15px;margin:12px 0}
.card h2{margin:0 0 10px;color:var(--gold2);font-family:Georgia,serif}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.kpi{background:var(--panel2);border:1px solid var(--line);border-radius:13px;padding:11px;text-align:center}.kpi b{font-size:23px;color:var(--gold2);display:block}.kpi span{font-size:11px;color:var(--muted)}
.item{padding:12px 0;border-bottom:1px solid #24282a}.item:last-child{border-bottom:0}
.name{font-weight:800}.muted{color:var(--muted);font-size:12px}.tag{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:4px 8px;font-size:11px;color:#ddd4be;margin:2px}
.btn{border:1px solid var(--gold);background:#16130b;color:var(--gold2);border-radius:11px;padding:9px 12px;font-weight:700}.btn.primary{background:var(--gold);color:#080808}.btn.danger{border-color:#7d2020;color:#ff8e8e}
input,select,textarea{width:100%;background:#0b0e0f;color:var(--text);border:1px solid #353a3c;border-radius:10px;padding:10px;margin:4px 0 9px}
label{font-size:11px;color:#d7d1c4;font-weight:700}
.hidden{display:none}
nav{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;justify-content:center;padding:7px 7px calc(7px + env(safe-area-inset-bottom));background:#080a0b;border-top:1px solid var(--line);box-shadow:0 -6px 22px #000b}
nav button{flex:1;max-width:145px;border:0;background:transparent;color:#888;padding:7px 3px 5px;font-size:10px}
nav button.active{color:var(--gold2);font-weight:800}
nav .ni{display:block;font-size:19px;line-height:20px;margin-bottom:2px}
.notice{border-left:3px solid var(--gold);background:#171309;border-radius:10px;padding:11px;color:#ded6c5;font-size:12px}
@media(min-width:650px){main{padding:22px}.grid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="logo-cross">✠</div>
  <div class="brand">ALMIRANTE</div>
  <div class="sub">CANARIL · CANÁRIOS BELGAS · ARLEQUIM PORTUGUÊS</div>
</header>
<main>
<section id="inicio"></section>
<section id="plantel" class="hidden"></section>
<section id="casais" class="hidden"></section>
<section id="filhotes" class="hidden"></section>
<section id="agenda" class="hidden"></section>
</main>
<nav>
<button onclick="show('inicio')" id="n-inicio"><span class="ni">⌂</span>Início</button>
<button onclick="show('plantel')" id="n-plantel"><span class="ni">🐦</span>Plantel</button>
<button onclick="show('casais')" id="n-casais"><span class="ni">♧</span>Casais</button>
<button onclick="show('filhotes')" id="n-filhotes"><span class="ni">🐣</span>Filhotes</button>
<button onclick="show('agenda')" id="n-agenda"><span class="ni">▦</span>Agenda</button>
</nav>
</div>
<script>
const KEY='almirante_v3_visual';
const seed={
birds:[
{name:'Ancião',sex:'Macho',year:'2024',breed:'Arlequim Português',crest:false},
{name:'Patroa',sex:'Fêmea',year:'2025',breed:'Arlequim Português',crest:false},
{name:'Soberana',sex:'Fêmea',year:'2025',breed:'Arlequim Português',crest:false},
{name:'Buglê',sex:'Macho',year:'2025',breed:'Arlequim Português',crest:true},
{name:'Pinky Mary',sex:'Fêmea',year:'2025',breed:'Arlequim Português',crest:false},
{name:'Coisado',sex:'Macho',year:'2025',breed:'Arlequim Português',crest:false},
{name:'Franjinha',sex:'Fêmea',year:'2025',breed:'Arlequim Português',crest:true},
{name:'Bianchini',sex:'Macho',year:'2025',breed:'Arlequim Português',crest:false}],
pairs:[
{name:'Patroa × Ancião',female:'Patroa',male:'Ancião',status:'Ativo',nest:1,eggs:0},
{name:'Soberana × Buglê',female:'Soberana',male:'Buglê',status:'Ativo',nest:2,eggs:0},
{name:'Pinky Mary × Coisado',female:'Pinky Mary',male:'Coisado',status:'Ativo',nest:3,eggs:0},
{name:'Franjinha × Bianchini',female:'Franjinha',male:'Bianchini',status:'Ativo',nest:4,eggs:0}],
chicks:[],events:[
{date:'02/09/2026',text:'Patroa entrou no ninho e permaneceu cerca de 5–8 minutos.',pair:'Patroa × Ancião'},
{date:'01/09/2026',text:'Cópulas observadas após as 18h.',pair:'Patroa × Ancião'}]};
let db=JSON.parse(localStorage.getItem(KEY)||'null')||seed;
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function show(id){
 document.querySelectorAll('main>section').forEach(s=>s.classList.add('hidden'));
 document.getElementById(id).classList.remove('hidden');
 document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
 document.getElementById('n-'+id).classList.add('active');
 render();
}
function tile(icon,title,sub,id){return `<button class="tile" onclick="show('${id}')"><div class="ico">${icon}</div><b>${title}</b><small>${sub}</small></button>`}
function renderInicio(){
 document.getElementById('inicio').innerHTML=`<div class="hero"><div class="logo-cross">✠</div><h2>ALMIRANTE CANARIL</h2><p>Gestão do plantel, reprodução e genética</p>
 <div class="grid">${tile('🐦','PLANTEL','Meus canários','plantel')}${tile('♧','CASAIS','Reprodução','casais')}${tile('🐣','FILHOTES','Acompanhamento','filhotes')}${tile('▦','AGENDA','Eventos e manejo','agenda')}</div></div>
 <div class="card"><h2>Visão geral</h2><div class="kpis"><div class="kpi"><b>${db.birds.length}</b><span>Canários</span></div><div class="kpi"><b>${db.pairs.length}</b><span>Casais</span></div><div class="kpi"><b>${db.chicks.length}</b><span>Filhotes</span></div></div></div>
 <div class="notice">✠ <b>Almirante</b> — tradição, qualidade, manejo e disciplina.</div>`;
}
function renderPlantel(){
 let list=db.birds.map((b,i)=>`<div class="item"><div class="row"><div><div class="name">${b.name} ${b.sex==='Macho'?'♂':'♀'}</div><div class="muted">${b.breed} · ${b.year}</div></div><span class="tag">${b.crest?'Topete':'Sem topete'}</span></div></div>`).join('');
 document.getElementById('plantel').innerHTML=`<div class="card"><div class="row"><h2>PLANTEL</h2><button class="btn primary" onclick="addBird()">+ Canário</button></div>${list}</div>`;
}
function renderCasais(){
 let list=db.pairs.map((p,i)=>`<div class="item"><div class="row"><div><div class="name">${p.name}</div><div class="muted">Ninho ${p.nest} · ${p.status}</div></div><span class="tag">${p.eggs} ovos</span></div></div>`).join('');
 document.getElementById('casais').innerHTML=`<div class="card"><div class="row"><h2>CASAIS</h2><button class="btn primary" onclick="addEgg()">+ Ovo</button></div>${list}</div>
 <div class="card"><h2>Mais adiantado</h2><div class="notice"><b>Patroa × Ancião</b><br>Patroa já apresenta comportamento de permanência no ninho.</div></div>`;
}
function renderChicks(){
 let list=db.chicks.length?db.chicks.map(c=>`<div class="item"><b>${c.code}</b><div class="muted">${c.date} · ${c.sex||'Sexo não definido'} · ${c.pair}</div></div>`).join(''):'<div class="muted">Nenhum filhote registrado ainda.</div>';
 document.getElementById('filhotes').innerHTML=`<div class="card"><div class="row"><h2>FILHOTES</h2><button class="btn primary" onclick="addChick()">+ Filhote</button></div>${list}</div>`;
}
function renderAgenda(){
 let list=db.events.slice().reverse().map(e=>`<div class="item"><div class="name">${e.date}</div><div>${e.text}</div><div class="muted">${e.pair||''}</div></div>`).join('');
 document.getElementById('agenda').innerHTML=`<div class="card"><div class="row"><h2>AGENDA</h2><button class="btn primary" onclick="addEvent()">+ Evento</button></div>${list}</div>`;
}
function render(){renderInicio();renderPlantel();renderCasais();renderChicks();renderAgenda()}
function addBird(){let name=prompt('Nome do canário:');if(!name)return;let sex=prompt('Sexo (Macho/Fêmea):','Macho')||'Macho';db.birds.push({name,sex,year:'2026',breed:'Arlequim Português',crest:false});save();render()}
function addEgg(){let p=db.pairs[0];p.eggs++;db.events.push({date:new Date().toLocaleDateString('pt-BR'),text:'Ovo registrado.',pair:p.name});save();render()}
function addChick(){let pair=prompt('Casal:','Patroa × Ancião')||'Patroa × Ancião';let n=db.chicks.length+1;let code='ALM-'+new Date().getFullYear()+'-'+String(n).padStart(3,'0');db.chicks.push({code,date:new Date().toLocaleDateString('pt-BR'),sex:'',pair});save();render()}
function addEvent(){let text=prompt('Descrição do evento:');if(!text)return;db.events.push({date:new Date().toLocaleDateString('pt-BR'),text,pair:''});save();render()}
show('inicio');
</script>
</body>
</html>
