<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#18212b"><link rel="manifest" href="manifest.json">
<title>Canaril Almirante</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f4f6f8;color:#18212b}
header{background:#18212b;color:white;padding:18px 16px 16px;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:21px}header small{opacity:.75}.wrap{max-width:900px;margin:auto;padding:14px 14px 90px}
.card{background:white;border-radius:16px;padding:15px;margin:10px 0;box-shadow:0 2px 10px #0000000b}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}@media(min-width:650px){.grid{grid-template-columns:repeat(4,1fr)}}
.kpi{padding:14px;border-radius:14px;background:#eef2f5}.kpi b{display:block;font-size:26px}.btn{border:0;border-radius:11px;padding:10px 13px;background:#18212b;color:white;font-weight:650;cursor:pointer;margin:3px}.btn.alt{background:#e8edf1;color:#18212b}.btn.danger{background:#b42318}.row{display:flex;justify-content:space-between;gap:8px;align-items:center}.tag{display:inline-block;background:#edf1f4;border-radius:20px;padding:4px 8px;font-size:12px;margin:2px}
nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #ddd;display:flex;justify-content:center;z-index:10}nav button{flex:1;max-width:180px;background:white;border:0;padding:11px 5px;font-size:12px;color:#56616c}
nav button.active{color:#18212b;font-weight:800}.hidden{display:none}input,select,textarea{width:100%;padding:10px;border:1px solid #ccd3d9;border-radius:10px;background:white;margin:4px 0 9px}label{font-size:12px;font-weight:700}.item{padding:12px 0;border-bottom:1px solid #edf0f2}.item:last-child{border:0}
h2{font-size:18px;margin:5px 0 10px}h3{font-size:15px;margin:3px 0}.muted{color:#69747e;font-size:13px}.notice{padding:11px;border-radius:11px;background:#fff6d8;margin:8px 0}.ok{background:#eaf7ed}.photo{width:54px;height:54px;border-radius:50%;object-fit:cover;background:#e9edf0}.avatar{display:flex;gap:10px;align-items:center}
</style>
</head>
<body>
<header><h1>🐦 Canaril Almirante</h1><small>Gestão do plantel e reprodução</small></header>
<div class="wrap">
<section id="dashboard"></section><section id="plantel" class="hidden"></section><section id="casais" class="hidden"></section><section id="repro" class="hidden"></section><section id="pedigree" class="hidden"></section><section id="agenda" class="hidden"></section>
</div>
<nav>
<button onclick="show('dashboard')" id="n-dashboard">🏠<br>Início</button>
<button onclick="show('plantel')" id="n-plantel">🐤<br>Plantel</button>
<button onclick="show('casais')" id="n-casais">❤️<br>Casais</button>
<button onclick="show('repro')" id="n-repro">🥚<br>Reprodução</button>
<button onclick="show('pedigree')" id="n-pedigree">🌳<br>Pedigree</button>
</nav>

<script>
const KEY='almirante_v3';
const seed={
birds:[
['Ancião','Macho','2024','Arlequim Português','Não'],['Patroa','Fêmea','2025','Arlequim Português','Não'],
['Soberana','Fêmea','2025','Arlequim Português','Não'],['Buglê','Macho','2025','Arlequim Português','Sim'],
['Pinky Mary','Fêmea','2025','Arlequim Português','Não'],['Coisado','Macho','2025','Arlequim Português','Não'],
['Franjinha','Fêmea','2025','Arlequim Português','Sim'],['Bianchini','Macho','2025','Arlequim Português','Não']],
pairs:[
{id:1,f:'Patroa',m:'Ancião',status:'Ativo',nest:'Em construção',eggs:0},
{id:2,f:'Soberana',m:'Buglê',status:'Preparação',nest:'',eggs:0},
{id:3,f:'Pinky Mary',m:'Coisado',status:'Preparação',nest:'',eggs:0},
{id:4,f:'Franjinha',m:'Bianchini',status:'Preparação',nest:'',eggs:0}],
chicks:[],events:[
{date:'02/09/2026',pair:'Patroa × Ancião',text:'Patroa entrou no ninho e permaneceu aproximadamente 5–8 minutos, deitada quieta.'},
{date:'01/09/2026',pair:'Patroa × Ancião',text:'Copulações observadas.'}]};
let db=JSON.parse(localStorage.getItem(KEY)||'null')||seed;
function save(){localStorage.setItem(KEY,JSON.stringify(db));renderAll()}
function esc(s=''){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function show(id){document.querySelectorAll('section').forEach(x=>x.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));document.getElementById('n-'+id).classList.add('active');renderAll()}
function pairName(p){return p.f+' × '+p.m}
function dashboard(){
let today=new Date();let next=[];
db.events.forEach(e=>{if(e.date==='02/09/2026')next.push(e)});
return `<h2>Painel</h2><div class="grid">
<div class="kpi"><span>Plantel</span><b>${db.birds.length}</b></div><div class="kpi"><span>Casais</span><b>${db.pairs.length}</b></div>
<div class="kpi"><span>Filhotes</span><b>${db.chicks.length}</b></div><div class="kpi"><span>Eventos</span><b>${db.events.length}</b></div></div>
<div class="card"><h2>🔔 Atenção hoje</h2><div class="notice"><b>Patroa × Ancião</b><br>Casal mais adiantado. Patroa já está entrando no ninho e ficando alguns minutos.</div>
<button class="btn" onclick="show('repro')">Registrar reprodução</button></div>
<div class="card"><h2>Casais</h2>${db.pairs.map(p=>`<div class="item"><div class="row"><b>${esc(pairName(p))}</b><span class="tag">${esc(p.status)}</span></div><div class="muted">Ninho: ${esc(p.nest||'não iniciado')} · Ovos: ${p.eggs} · Filhotes: ${db.chicks.filter(c=>c.pairId==p.id).length}</div></div>`).join('')}</div>`
}
function plantel(){
return `<h2>🐤 Plantel</h2><div class="card"><button class="btn" onclick="newBird()">+ Novo canário</button></div>
${db.birds.map((b,i)=>`<div class="card"><div class="row"><div><h3>${esc(b[0])}</h3><div class="muted">${b[1]} · ${b[2]} · ${b[3]}</div></div><button class="btn alt" onclick="editBird(${i})">Editar</button></div><span class="tag">Topete: ${b[4]}</span></div>`).join('')}`
}
function casais(){
return `<h2>❤️ Casais</h2>${db.pairs.map(p=>`<div class="card"><div class="row"><div><h3>${esc(pairName(p))}</h3><div class="muted">${p.status} · Ninho: ${p.nest||'—'}</div></div><button class="btn alt" onclick="pairActions(${p.id})">Abrir</button></div><div><span class="tag">🥚 ${p.eggs} ovos</span><span class="tag">🐣 ${db.chicks.filter(c=>c.pairId==p.id).length} filhotes</span></div></div>`).join('')}
<div class="card"><button class="btn" onclick="newPair()">+ Novo casal</button></div>`
}
function repro(){
return `<h2>🥚 Reprodução</h2><div class="card"><h3>Registrar evento</h3>
<label>Casal</label><select id="evpair">${db.pairs.map(p=>`<option value="${p.id}">${esc(pairName(p))}</option>`).join('')}</select>
<label>Tipo</label><select id="evtype"><option>Copulação</option><option>Entrada no ninho</option><option>Primeiro ovo</option><option>Ovo</option><option>Filhote nascido</option><option>Anilhamento</option><option>Separação do filhote</option><option>Observação</option></select>
<label>Data</label><input id="evdate" type="date" value="2026-09-02"><label>Observação</label><textarea id="evtext" placeholder="Detalhes"></textarea>
<button class="btn" onclick="addEvent()">Salvar evento</button></div>
<div class="card"><h2>Histórico</h2>${db.events.slice().reverse().map(e=>`<div class="item"><b>${esc(e.date)} · ${esc(e.pair)}</b><br>${esc(e.text)}</div>`).join('')}</div>`
}
function pedigree(){
return `<h2>🌳 Pedigree</h2><div class="card"><p class="muted">Os filhotes registrados ficam ligados automaticamente ao casal. Ao adicionar pais dos reprodutores, o sistema poderá montar avós e bisavós.</p>
${db.chicks.length?db.chicks.map(c=>`<div class="item"><b>${esc(c.code)}</b> · ${esc(c.name||'Filhote')}</div>`).join(''):'<p>Nenhum filhote registrado ainda.</p>'}</div>
<div class="card"><h3>Filhotes por casal</h3>${db.pairs.map(p=>`<div class="item"><b>${esc(pairName(p))}</b><br>${db.chicks.filter(c=>c.pairId==p.id).map(c=>esc(c.code)).join(', ')||'Nenhum'}</div>`).join('')}</div>`
}
function agenda(){
let dates=[...db.events].sort((a,b)=>b.date.localeCompare(a.date));
return `<h2>📅 Agenda e alertas</h2><div class="card"><div class="notice ok"><b>Automação preparada</b><br>Ao registrar o primeiro ovo, a próxima versão pode calcular automaticamente incubação, nascimento estimado, anilhamento e separação.</div></div>
<div class="card">${dates.map(e=>`<div class="item"><b>${esc(e.date)}</b> — ${esc(e.pair)}<br>${esc(e.text)}</div>`).join('')}</div>`
}
function renderAll(){document.getElementById('dashboard').innerHTML=dashboard();document.getElementById('plantel').innerHTML=plantel();document.getElementById('casais').innerHTML=casais();document.getElementById('repro').innerHTML=repro();document.getElementById('pedigree').innerHTML=pedigree();document.getElementById('agenda').innerHTML=agenda()}
function newBird(){let n=prompt('Nome do canário:');if(!n)return;let sex=prompt('Sexo (Macho/Fêmea):','Macho')||'';let year=prompt('Ano de nascimento:','2026')||'';db.birds.push([n,sex,year,'Arlequim Português','Não']);save();show('plantel')}
function editBird(i){let b=db.birds[i];let n=prompt('Nome:',b[0]);if(!n)return;b[0]=n;b[1]=prompt('Sexo:',b[1])||b[1];b[2]=prompt('Ano:',b[2])||b[2];b[3]=prompt('Raça:',b[3])||b[3];b[4]=prompt('Topete (Sim/Não):',b[4])||b[4];save()}
function newPair(){let f=prompt('Nome da fêmea:');let m=prompt('Nome do macho:');if(f&&m){db.pairs.push({id:Date.now(),f,m,status:'Preparação',nest:'',eggs:0});save()}}
function pairActions(id){let p=db.pairs.find(x=>x.id==id);let op=prompt(`Casal ${pairName(p)}\n1=registrar ovo\n2=registrar filhote\n3=alterar status\n4=alterar ninho`,'1');if(op==='1'){p.eggs++;db.events.push({date:'02/09/2026',pair:pairName(p),text:`Ovo registrado. Total do casal: ${p.eggs}.`});save()}else if(op==='2'){let code='ALM-'+new Date().getFullYear()+'-'+String(db.chicks.length+1).padStart(3,'0');db.chicks.push({code,name:'',pairId:id,birth:'02/09/2026',sex:'Indefinido'});db.events.push({date:'02/09/2026',pair:pairName(p),text:`Filhote ${code} registrado.`});save()}else if(op==='3'){p.status=prompt('Status:',p.status)||p.status;save()}else if(op==='4'){p.nest=prompt('Situação do ninho:',p.nest)||p.nest;save()}}
function addEvent(){let p=db.pairs.find(x=>x.id==+document.getElementById('evpair').value);let type=document.getElementById('evtype').value;let d=document.getElementById('evdate').value.split('-').reverse().join('/');let t=document.getElementById('evtext').value||type;if(type==='Ovo'||type==='Primeiro ovo'){p.eggs++;}db.events.push({date:d,pair:pairName(p),text:t});save()}
renderAll();show('dashboard');
if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
</body></html>
