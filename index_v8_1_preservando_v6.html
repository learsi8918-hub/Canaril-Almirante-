<!doctype html><html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050607">
<title>Canaril Almirante</title><style>
:root{--bg:#050607;--p:#0d1012;--g:#d7a936;--g2:#f0c85b;--r:#b51618;--t:#f5f3ed;--m:#aaa89f;--l:#4b3b16}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--t);font-family:system-ui,-apple-system,Segoe UI,sans-serif}body{padding-bottom:calc(78px + env(safe-area-inset-bottom))}
.app{max-width:760px;margin:auto;min-height:100vh}header{padding:14px;text-align:center;border-bottom:1px solid var(--l);background:#07090a;position:sticky;top:0;z-index:10}.cross{font-size:31px;color:#d21b1e}.brand{font:800 27px Georgia;color:var(--g2);letter-spacing:2px}.sub{font-size:10px;letter-spacing:1.5px;color:#ddd5c5}main{padding:14px}.card{background:var(--p);border:1px solid #292d2f;border-radius:17px;padding:15px;margin:12px 0}h2{margin:0 0 12px;color:var(--g2);font-family:Georgia}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.btn{border:1px solid var(--g);background:#17130a;color:var(--g2);border-radius:11px;padding:9px 12px;font-weight:700}.primary{background:var(--g);color:#080808}.danger{border-color:#7b2020;color:#ff9696}input,select,textarea{width:100%;background:#090c0d;color:var(--t);border:1px solid #3a3e40;border-radius:10px;padding:10px;margin:4px 0 9px}textarea{min-height:75px}label{font-size:11px;color:#d8d0c0;font-weight:700}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{border:1px solid var(--l);border-radius:17px;background:#0d1012;color:var(--t);padding:18px 8px;text-align:center}.tile span{font-size:30px}.tile b{display:block;color:var(--g2);margin-top:5px}.item{padding:12px 0;border-bottom:1px solid #25292b}.bird{display:flex;gap:12px;align-items:center}.photo{width:64px;height:64px;border-radius:14px;object-fit:cover;background:#171a1b;border:1px solid var(--l);display:flex;align-items:center;justify-content:center;font-size:28px}.big{width:115px;height:115px;border-radius:18px}.name{font-weight:800}.muted{font-size:12px;color:var(--m)}.tag{display:inline-block;border:1px solid var(--l);border-radius:999px;padding:4px 8px;font-size:10px;color:#ddd4be;margin:2px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.hidden{display:none}.notice{border-left:3px solid var(--g);background:#171309;padding:11px;border-radius:10px;font-size:12px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;justify-content:center;padding:7px 6px calc(7px + env(safe-area-inset-bottom));background:#080a0b;border-top:1px solid var(--l);box-shadow:0 -6px 22px #000b}nav button{flex:1;max-width:145px;border:0;background:transparent;color:#888;padding:6px 2px 4px;font-size:10px}nav button.active{color:var(--g2);font-weight:800}.ni{display:block;font-size:19px;line-height:20px}
</style></head><body><div class="app"><header><div class="cross">✠</div><div class="brand">CANARIL ALMIRANTE</div><div class="sub">CANÁRIOS BELGAS · ARLEQUIM PORTUGUÊS</div></header><main>
<section id="inicio"></section><section id="plantel" class="hidden"></section><section id="casais" class="hidden"></section><section id="filhotes" class="hidden"></section><section id="agenda" class="hidden"></section><section id="ficha" class="hidden"></section></main>
<nav><button onclick="show('inicio')" id="n-inicio"><span class="ni">⌂</span>Início</button><button onclick="show('plantel')" id="n-plantel"><span class="ni">🐦</span>Plantel</button><button onclick="show('casais')" id="n-casais"><span class="ni">♧</span>Casais</button><button onclick="show('filhotes')" id="n-filhotes"><span class="ni">🐣</span>Filhotes</button><button onclick="show('agenda')" id="n-agenda"><span class="ni">▦</span>Agenda</button></nav></div>
<script>
const K='almirante_v6';const OLD='almirante_v5';const OLD2='almirante_v4';const seed={birds:[
['Ancião','Macho','2024',0],['Patroa','Fêmea','2025',0],['Soberana','Fêmea','2025',0],['Buglê','Macho','2025',1],['Pinky Mary','Fêmea','2025',0],['Coisado','Macho','2025',0],['Franjinha','Fêmea','2025',1],['Bianchini','Macho','2025',0]].map(x=>({name:x[0],sex:x[1],year:x[2],crest:!!x[3],breed:'Arlequim Português',ring:'',color:'',status:'Reprodutor',notes:'',photo:''})),
pairs:[{name:'Patroa × Ancião',nest:1,eggs:0},{name:'Soberana × Buglê',nest:2,eggs:0},{name:'Pinky Mary × Coisado',nest:3,eggs:0},{name:'Franjinha × Bianchini',nest:4,eggs:0}],chicks:[],events:[]};
let db=JSON.parse(localStorage.getItem(K)||'null');
if(!db){db=JSON.parse(localStorage.getItem(OLD)||localStorage.getItem(OLD2)||'null')||seed;db.pairs=(db.pairs||[]).map(p=>({...p,ovoscopyDate:p.ovoscopyDate||'',ovoscopyResult:p.ovoscopyResult||'',firstEggDate:p.firstEggDate||''}));localStorage.setItem(K,JSON.stringify(db));}else{db.pairs=(db.pairs||[]).map(p=>({...p,ovoscopyDate:p.ovoscopyDate||'',ovoscopyResult:p.ovoscopyResult||'',firstEggDate:p.firstEggDate||''}));}

function save(){localStorage.setItem(K,JSON.stringify(db))}
function requestNotifications(){if(window.AndroidNotifications&&AndroidNotifications.requestPermission){AndroidNotifications.requestPermission();}else{alert('As notificações ficam disponíveis na versão Android V6.');}}
function show(id){document.querySelectorAll('main>section').forEach(s=>s.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));let n=document.getElementById('n-'+id);if(n)n.classList.add('active');render()}
function ph(b,big=false){return b.photo?`<img class="photo ${big?'big':''}" src="${b.photo}">`:`<div class="photo ${big?'big':''}">🐦</div>`}
function render(){inicio.innerHTML=`<div class="card" style="text-align:center"><div class="cross">✠</div><h2>CANARIL ALMIRANTE</h2><div class="muted">Gestão do plantel, reprodução, genética e lembretes</div><div class="actions" style="justify-content:center"><button class="btn primary" onclick="requestNotifications()">🔔 Ativar notificações</button></div></div><div class="grid"><button class="tile" onclick="show('plantel')"><span>🐦</span><b>PLANTEL</b>Fichas e fotos</button><button class="tile" onclick="show('casais')"><span>♧</span><b>CASAIS</b>Reprodução</button><button class="tile" onclick="show('filhotes')"><span>🐣</span><b>FILHOTES</b>Nascimentos</button><button class="tile" onclick="show('agenda')"><span>▦</span><b>AGENDA</b>Manejo</button></div>`;plantel.innerHTML=`<div class="card"><div class="row"><h2>PLANTEL</h2><button class="btn primary" onclick="edit(-1)">+ Canário</button></div>${db.birds.map((b,i)=>`<div class="item"><div class="bird">${ph(b)}<div style="flex:1"><div class="name">${b.name} ${b.sex==='Macho'?'♂':'♀'}</div><div class="muted">${b.breed} · ${b.year}</div><span class="tag">${b.crest?'Topete':'Sem topete'}</span></div><button class="btn" onclick="edit(${i})">Abrir</button></div></div>`).join('')}</div>`;
casais.innerHTML=`<div class="card"><h2>CASAIS E REPRODUÇÃO</h2><div class="notice">A partir do primeiro ovo, o aplicativo calcula automaticamente as janelas de nascimento, anilhamento e desmame e cria os lembretes. Você pode ajustar a ovoscopia.</div>${db.pairs.map((p,i)=>`<div class="item"><b>${p.name}</b>
<div class="muted">Ninho ${p.nest} · ${p.eggs} ovos</div>
<div class="grid">
<div><label>Primeiro ovo</label><input type="date" id="fe-${i}" value="${p.firstEggDate||''}" onchange="calcularRepro(${i})"></div>
<div><label>Ovoscopia</label><input type="date" id="ov-${i}" value="${p.ovoscopyDate||''}" onchange="salvarOvoscopia(${i})"></div>
<div><label>Nascimento previsto (13–15 dias)</label><input type="text" id="bn-${i}" value="${p.birthRange||''}" readonly></div>
<div><label>Anilhamento previsto</label><input type="text" id="rg-${i}" value="${p.ringRange||''}" readonly></div>
<div><label>Desmame previsto</label><input type="text" id="wn-${i}" value="${p.weanRange||''}" readonly></div>
<div><label>Resultado da ovoscopia</label><select id="or-${i}" onchange="salvarResultado(${i})"><option ${!p.ovoscopyResult||p.ovoscopyResult==='Não realizada'?'selected':''}>Não realizada</option><option ${p.ovoscopyResult==='Férteis'?'selected':''}>Férteis</option><option ${p.ovoscopyResult==='Claros'?'selected':''}>Claros</option><option ${p.ovoscopyResult==='Parcial'?'selected':''}>Parcial</option></select></div>
</div>
<div class="muted">🏷️ Anilhamento previsto: ${p.ringRange||'—'} · 🐥 Desmame previsto: ${p.weanRange||'—'}</div>
<div class="actions"><button class="btn primary" onclick="saveRepro(${i})">Salvar reprodução</button><button class="btn" onclick="egg(${i})">+ Ovo</button><button class="btn" onclick="obs(${i})">+ Observação</button></div></div>`).join('')}</div>`;
filhotes.innerHTML=`<div class="card"><div class="row"><h2>FILHOTES</h2><button class="btn primary" onclick="chick()">+ Filhote</button></div>${db.chicks.length?db.chicks.map(c=>`<div class="item"><b>${c.code}</b><div class="muted">${c.date} · ${c.sex||'Sexo não definido'} · ${c.pair}</div></div>`).join(''):'<div class="muted">Nenhum filhote registrado.</div>'}</div>`;
agenda.innerHTML=`<div class="card"><div class="row"><h2>AGENDA</h2><button class="btn primary" onclick="eventAdd()">+ Lembrete</button></div>
<div class="notice">As notificações programadas são do Android e podem aparecer com o aplicativo fechado. Na primeira vez, permita as notificações quando o Android solicitar.</div>
${db.events.slice().reverse().map(e=>`<div class="item"><b>${e.date}</b><div>${e.text}</div><div class="muted">${e.pair||''}</div></div>`).join('')}</div>`}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function edit(i){let b=i<0?{name:'',sex:'Macho',year:'2026',breed:'Arlequim Português',crest:false,ring:'',color:'',status:'Ativo',notes:'',photo:''}:db.birds[i];show('ficha');ficha.innerHTML=`<div class="card"><div class="row"><h2>${i<0?'NOVO CANÁRIO':'FICHA DO CANÁRIO'}</h2><button class="btn" onclick="show('plantel')">Voltar</button></div><div style="text-align:center">${ph(b,true)}</div><label>Foto da galeria</label><input id="foto" type="file" accept="image/*"><label>Nome</label><input id="nm" value="${esc(b.name)}"><label>Sexo</label><select id="sx"><option ${b.sex==='Macho'?'selected':''}>Macho</option><option ${b.sex==='Fêmea'?'selected':''}>Fêmea</option></select><label>Ano</label><input id="yr" value="${esc(b.year)}"><label>Raça</label><input id="br" value="${esc(b.breed)}"><label><input id="tp" type="checkbox" ${b.crest?'checked':''}> Topete</label><label>Anilha</label><input id="an" value="${esc(b.ring)}"><label>Cor / padrão</label><input id="co" value="${esc(b.color)}"><label>Status</label><input id="st" value="${esc(b.status)}"><label>Observações</label><textarea id="no">${esc(b.notes)}</textarea><div class="actions"><button class="btn primary" onclick="saveBird(${i})">Salvar ficha</button>${i>=0?`<button class="btn danger" onclick="delBird(${i})">Excluir</button>`:''}</div></div>`;foto.onchange=()=>{let f=foto.files[0];if(!f)return;let r=new FileReader();r.onload=()=>foto.dataset.data=r.result;r.readAsDataURL(f)}}
function saveBird(i){let old=i>=0?db.birds[i]:{};let b={name:nm.value.trim()||'Sem nome',sex:sx.value,year:yr.value,breed:br.value||'Arlequim Português',crest:tp.checked,ring:an.value,color:co.value,status:st.value,notes:no.value,photo:foto.dataset.data||old.photo||''};i<0?db.birds.push(b):db.birds[i]=b;save();show('plantel')}
function delBird(i){if(confirm('Excluir este canário?')){db.birds.splice(i,1);save();show('plantel')}}

function fmt(d){return d?d.toLocaleDateString('pt-BR'):''}

function isoAdd(iso,days){
  if(!iso)return '';
  let d=new Date(iso+'T12:00:00');
  d.setDate(d.getDate()+days);
  return d.toISOString().slice(0,10);
}

function dateRange(start,end){
  if(!start || !end)return '—';
  return fmt(new Date(start+'T12:00:00'))+' a '+fmt(new Date(end+'T12:00:00'));
}

function schedule(title,date,pair){
  if(!date)return;
  if(window.AndroidNotifications && AndroidNotifications.schedule){
    AndroidNotifications.schedule(title, date+'T08:00:00', pair||'');
  }
}

function calcularDados(p){
  if(!p.firstEggDate)return;

  let first=p.firstEggDate;

  p.birthStart=isoAdd(first,13);
  p.birthEnd=isoAdd(first,15);
  p.birthRange=dateRange(p.birthStart,p.birthEnd);

  p.ringStart=isoAdd(p.birthStart,6);
  p.ringEnd=isoAdd(p.birthEnd,6);
  p.ringRange=dateRange(p.ringStart,p.ringEnd);

  p.weanStart=isoAdd(p.birthStart,30);
  p.weanEnd=isoAdd(p.birthEnd,35);
  p.weanRange=dateRange(p.weanStart,p.weanEnd);

  if(!p.ovoscopyDate)p.ovoscopyDate=isoAdd(first,6);
}

function atualizarTelaRepro(i){
  let p=db.pairs[i];
  calcularDados(p);

  let ov=document.getElementById('ov-'+i);
  let bn=document.getElementById('bn-'+i);
  let rg=document.getElementById('rg-'+i);
  let wn=document.getElementById('wn-'+i);

  if(ov)ov.value=p.ovoscopyDate||'';
  if(bn)bn.value=p.birthRange||'';
  if(rg)rg.textContent=p.ringRange||'—';
  if(wn)wn.textContent=p.weanRange||'—';
}

function calcularRepro(i){
  let p=db.pairs[i];
  let first=document.getElementById('fe-'+i).value;

  if(!first){
    p.firstEggDate='';
    p.birthStart='';p.birthEnd='';p.birthRange='';
    p.ringStart='';p.ringEnd='';p.ringRange='';
    p.weanStart='';p.weanEnd='';p.weanRange='';
    p.ovoscopyDate='';
    save();
    document.getElementById('ov-'+i).value='';
    document.getElementById('bn-'+i).value='';
    let item=document.getElementById('bn-'+i).closest('.item');
    let muted=item ? item.querySelector('.muted:last-of-type') : null;
    if(muted)muted.innerHTML='🏷️ Anilhamento previsto: — · 🐥 Desmame previsto: —';
    return;
  }

  p.firstEggDate=first;
  calcularDados(p);
  save();
  atualizarTelaRepro(i);
}

function scheduleRepro(p){
  if(!p.firstEggDate)return;

  calcularDados(p);

  schedule('Ovoscopia — '+p.name,p.ovoscopyDate,p.name);

  schedule('Nascimento previsto — início — '+p.name,p.birthStart,p.name);
  schedule('Nascimento previsto — final — '+p.name,p.birthEnd,p.name);

  schedule('Anilhamento previsto — início — '+p.name,p.ringStart,p.name);
  schedule('Anilhamento previsto — final — '+p.name,p.ringEnd,p.name);

  schedule('Desmame previsto — início — '+p.name,p.weanStart,p.name);
  schedule('Desmame previsto — final — '+p.name,p.weanEnd,p.name);
}

function salvarOvoscopia(i){
  let p=db.pairs[i];
  p.ovoscopyDate=document.getElementById('ov-'+i).value;
  save();
}

function salvarResultado(i){
  let p=db.pairs[i];
  p.ovoscopyResult=document.getElementById('or-'+i).value;
  save();
}

function egg(i){
  let p=db.pairs[i];
  p.eggs++;
  if(!p.firstEggDate)p.firstEggDate=new Date().toISOString().slice(0,10);

  calcularDados(p);
  scheduleRepro(p);

  db.events.push({date:fmt(new Date()),text:'Ovo registrado. Nascimento previsto: '+p.birthRange,pair:p.name});
  save();
  render();
}

function saveRepro(i){
  let p=db.pairs[i];

  p.firstEggDate=document.getElementById('fe-'+i).value;
  p.ovoscopyDate=document.getElementById('ov-'+i).value;
  p.ovoscopyResult=document.getElementById('or-'+i).value;

  if(p.firstEggDate){
    calcularDados(p);
    scheduleRepro(p);
  }

  db.events.push({
    date:fmt(new Date()),
    text:'Reprodução atualizada. Ovoscopia: '+
      (p.ovoscopyDate?fmt(new Date(p.ovoscopyDate+'T12:00:00')):'não definida')+
      ' · Nascimento previsto: '+
      (p.birthRange||'não definido'),
    pair:p.name
  });

  save();
  render();
}

function saveOvo(i){saveRepro(i)}

function obs(i){
  let p=db.pairs[i];
  let t=prompt('Observação para '+p.name+':');
  if(t){
    db.events.push({date:fmt(new Date()),text:t,pair:p.name});
    save();
    render();
  }
}

function chick(){
  let p=prompt('Casal:',db.pairs[0].name);
  if(!p)return;
  let c='ALM-'+new Date().getFullYear()+'-'+String(db.chicks.length+1).padStart(3,'0');
  db.chicks.push({code:c,date:new Date().toLocaleDateString('pt-BR'),sex:'',pair:p});
  save();
  render();
}

function eventAdd(){
  let t=prompt('Descrição do lembrete:');
  if(!t)return;
  let d=prompt('Data (AAAA-MM-DD):',new Date().toISOString().slice(0,10));
  if(!d)return;
  let h=prompt('Horário (HH:MM):','08:00')||'08:00';

  db.events.push({date:fmt(new Date(d+'T12:00:00')),text:t,pair:'',iso:d+'T'+h+':00'});

  if(window.AndroidNotifications&&AndroidNotifications.schedule)
    AndroidNotifications.schedule(t,d+'T'+h+':00','Canaril Almirante');

  save();
  render();
}

db.pairs.forEach(p=>{
  if(p.firstEggDate){
    calcularDados(p);
    scheduleRepro(p);
  }
});

save();
show('inicio');
</script>
<script>
(function(){
function getPlantel(){ try{return JSON.parse(localStorage.getItem("almirante_v6")||"{}");}catch(e){return {};} }
function setPlantel(x){localStorage.setItem("almirante_v6",JSON.stringify(x));}
function v8Pairs(){let p=getPlantel(); if(!Array.isArray(p.pairs))p.pairs=[]; p.pairs.forEach(x=>{if(!Array.isArray(x.posturas))x.posturas=[];}); return p;}
window.v8NovaPostura=function(i){
 let p=v8Pairs(); if(!p.pairs[i])return; p.pairs[i].posturas.push({ovos:[{resultado:""}]}); setPlantel(p); v8Render(i);
};
window.v8AddOvo=function(i,pi){let p=v8Pairs();let post=p.pairs[i]?.posturas[pi];if(!post)return;post.ovos.push({resultado:""});setPlantel(p);v8Render(i);};
window.v8DelOvo=function(i,pi,oi){let p=v8Pairs();let o=p.pairs[i]?.posturas[pi]?.ovos;if(!o)return;if(o.length>1)o.splice(oi,1);setPlantel(p);v8Render(i);};
window.v8Resultado=function(i,pi,oi,v){let p=v8Pairs();let o=p.pairs[i]?.posturas[pi]?.ovos[oi];if(!o)return;o.resultado=v;setPlantel(p);v8Render(i);};
window.v8DelPostura=function(i,pi){if(!confirm("Apagar esta postura e todos os seus ovos?"))return;let p=v8Pairs();p.pairs[i].posturas.splice(pi,1);setPlantel(p);v8Render(i);};
window.v8ResetPostura=function(i,pi){if(!confirm("Refazer esta postura? Os ovos registrados serão apagados."))return;let p=v8Pairs();p.pairs[i].posturas[pi]={ovos:[{resultado:""}]};setPlantel(p);v8Render(i);};
window.v8Render=function(i){
 let p=v8Pairs(), pair=p.pairs[i], box=document.getElementById("v8-clutch-"+i); if(!box||!pair)return;
 let out="";
 (pair.posturas||[]).forEach((post,pi)=>{
  let ovos=post.ovos||[],f=ovos.filter(o=>o.resultado==="fertil").length,inf=ovos.filter(o=>o.resultado==="infertil").length;
  out+=`<div class="item"><b>${pi+1}ª postura</b>
  <button type="button" onclick="v8ResetPostura(${i},${pi})">↻ Refazer</button>
  <button type="button" onclick="v8DelPostura(${i},${pi})">🗑 Apagar</button>`;
  ovos.forEach((o,oi)=>{out+=`<div style="margin-top:6px">🥚 Ovo ${oi+1}
  <select onchange="v8Resultado(${i},${pi},${oi},this.value)">
  <option value="">Resultado</option><option value="fertil" ${o.resultado==="fertil"?"selected":""}>Fértil</option>
  <option value="infertil" ${o.resultado==="infertil"?"selected":""}>Não fértil</option></select>
  <button type="button" onclick="v8DelOvo(${i},${pi},${oi})">×</button></div>`});
  out+=`<button type="button" onclick="v8AddOvo(${i},${pi})">+ Ovo</button>
  <div class="muted">Total no ninho: ${ovos.length} · Férteis: ${f} · Não férteis: ${inf}</div></div>`;
 });
 box.innerHTML=out||'<div class="muted">Nenhuma postura registrada ainda.</div>';
};
window.v8Inject=function(){
 let p=v8Pairs();
 p.pairs.forEach((pair,i)=>{
  let id="v8-clutch-"+i;
  if(document.getElementById(id))return;
  let candidates=[...document.querySelectorAll("body *")].filter(e=>e.children.length===0 && (e.textContent||"").includes(pair.female||"___"));
  let parent=candidates.length?candidates[0].closest(".card,.item,section,div"):null;
  if(!parent) parent=document.body;
  let box=document.createElement("div");box.className="card";box.style.marginTop="12px";
  box.innerHTML=`<h3>🪺 Atualização do ninho</h3><div class="muted">Registre cada ovo e o resultado.</div><button type="button" onclick="v8NovaPostura(${i})">+ Nova postura</button><div id="${id}" style="margin-top:10px"></div>`;
  parent.appendChild(box); v8Render(i);
 });
};
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",()=>setTimeout(v8Inject,500));else setTimeout(v8Inject,500);
})();
</script>
</body></html>
